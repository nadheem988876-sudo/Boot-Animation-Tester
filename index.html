<style>

<script>
'use strict';
const IMG_RE=/\.(png|jpe?g|webp)$/i;
const baseName=p=>p.slice(p.lastIndexOf('/')+1);
const cmp=(a,b)=>a<b?-1:a>b?1:0;
let FINISH_LOOP=true;

function parseDesc(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) throw new Error('desc.txt is empty.');
  const h=lines[0].match(/^(\d+)\s+(\d+)\s+(\d+)/);
  if(!h) throw new Error('The first line of desc.txt must look like "WIDTH HEIGHT FPS".');
  const out={width:+h[1],height:+h[2],fps:+h[3]||30,parts:[],warnings:[]};
  if(!out.width||!out.height) throw new Error('desc.txt has a zero width or height.');
  for(const ln of lines.slice(1)){
    const m=ln.match(/^([pcf])\s+(\d+)\s+(\d+)\s+(\S+)(?:\s+#([0-9a-fA-F]{6}))?/);
    if(m) out.parts.push({rawType:m[1],type:m[1]==='c'?'c':'p',count:+m[2],pause:+m[3],path:m[4],bg:m[5]?'#'+m[5]:null});
    else if(ln[0]!=='#') out.warnings.push('Ignored desc.txt line: '+ln);
  }
  if(!out.parts.length) throw new Error('desc.txt lists no parts (lines like "p 1 0 part0").');
  if(out.parts.some(p=>p.rawType==='f')) out.warnings.push('desc.txt uses an "f" part; it is played like a normal "p" part here.');
  return out;
}
function parseTrim(text){
  return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
    const m=l.match(/(\d+)\s*x\s*(\d+)\s*\+\s*(-?\d+)\s*\+\s*(-?\d+)/);
    return m?{w:+m[1],h:+m[2],x:+m[3],y:+m[4]}:null;
  });
}
function zipEntries(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-22-65535);i--){
    if(dv.getUint32(i,true)===0x06054b50){e=i;break;}
  }
  if(e<0) throw new Error('This is not a valid zip file (central directory not found).');
  const total=dv.getUint16(e+10,true),cdOff=dv.getUint32(e+16,true);
  if(total===0xFFFF||cdOff===0xFFFFFFFF) throw new Error('Zip64 archives are not supported.');
  const td=new TextDecoder(),out=[];let p=cdOff;
  for(let i=0;i<total;i++){
    if(p+46>u8.length||dv.getUint32(p,true)!==0x02014b50) throw new Error('The zip directory is damaged.');
    const flags=dv.getUint16(p+8,true),method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true),usize=dv.getUint32(p+24,true);
    const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl)).replace(/\\/g,'/');
    out.push({name,method,csize,usize,lho,flags,dir:name.endsWith('/')});
    p+=46+nl+xl+cl;
  }
  return out;
}
async function zipData(u8,e){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  if(dv.getUint32(e.lho,true)!==0x04034b50) throw new Error('Bad zip entry header for '+e.name);
  const s=e.lho+30+dv.getUint16(e.lho+26,true)+dv.getUint16(e.lho+28,true);
  const raw=u8.subarray(s,s+e.csize);
  if(e.method===0) return raw;
  if(e.method===8){
    if(typeof DecompressionStream==='undefined') throw new Error('This browser cannot unpack compressed zip entries (no DecompressionStream).');
    const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  throw new Error('Unsupported zip compression method '+e.method+' for '+e.name);
}
function locate(entries){
  const clean=entries.filter(e=>!e.dir&&!/(^|\/)__MACOSX\//.test(e.name)&&!/(^|\/)\._/.test(e.name));
  const ds=clean.filter(e=>/(^|\/)desc\.txt$/i.test(e.name)).sort((a,b)=>a.name.split('/').length-b.name.split('/').length);
  if(!ds.length) throw new Error('No desc.txt found in this zip. A boot animation zip needs desc.txt plus part folders of PNG/JPG frames.');
  const d=ds[0];
  return {clean,descEntry:d,base:d.name.slice(0,d.name.length-8)};
}
function collectParts(desc,base,clean){
  for(const p of desc.parts){
    const pre=base+p.path+'/';
    p.files=clean.filter(e=>e.name.startsWith(pre)&&IMG_RE.test(e.name)&&e.name.indexOf('/',pre.length)<0)
      .sort((a,b)=>cmp(baseName(a.name),baseName(b.name)));
    p.trimEntry=clean.find(e=>e.name===pre+'trim.txt')||null;
    p.audioEntry=clean.find(e=>e.name.toLowerCase()===(pre+'audio.wav').toLowerCase())||null;
  }
}

function* sequence(){
  const exit=()=>P.ctrl.bootComplete;
  for(let pi=0;pi<anim.parts.length;pi++){
    const part=anim.parts[pi];
    if(!part.frames.length) continue;
    const mustFinish=part.type==='c';
    P.ctrl.curPart=pi;P.ctrl.iterDone=0;
    for(let r=0;part.count===0||r<part.count;r++){
      if(exit()&&!mustFinish) break;
      let cut=false;
      for(let fi=0;fi<part.frames.length;fi++){
        if(exit()&&!mustFinish&&!FINISH_LOOP){cut=true;break;}
        yield {k:'frame',pi,r,fi};
      }
      P.ctrl.iterDone=r+1;
      if(part.pause>0&&!cut) yield {k:'pause',pi,r,n:part.pause};
      if(part.count===0&&exit()) break;
    }
  }
}
function predict(cur,n){
  const out=[],parts=anim.parts,exit=P.ctrl.bootComplete;
  let pi=cur.pi,r=cur.r,fi=cur.fi,guard=0;
  const nextPart=from=>{let k=from+1;while(k<parts.length&&(!parts[k].frames.length||(exit&&parts[k].type!=='c')))k++;return k;};
  while(out.length<n&&guard++<n*4){
    const part=parts[pi];fi++;
    if(fi>=part.frames.length){
      fi=0;r++;
      const leave=part.count!==0?r>=part.count:exit;
      if(part.count===0&&!exit){
        const k=nextPart(pi);
        if(k<parts.length) for(let j=0;j<Math.min(8,parts[k].frames.length);j++) out.push([k,j]);
      }
      if(leave){const k=nextPart(pi);if(k>=parts.length)break;pi=k;r=0;}
    }
    out.push([pi,fi]);
  }
  return out;
}

const be32=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
const be16=n=>[(n>>>8)&255,n&255];
const fourcc=s=>[s.charCodeAt(0),s.charCodeAt(1),s.charCodeAt(2),s.charCodeAt(3)];
const zeros=n=>new Array(n).fill(0);
function mkBox(type,...parts){
  const bs=parts.map(p=>p instanceof Uint8Array?p:Uint8Array.from(p));
  let len=8;for(const b of bs) len+=b.length;
  const o=new Uint8Array(len);o.set(be32(len),0);o.set(fourcc(type),4);
  let p=8;for(const b of bs){o.set(b,p);p+=b.length;}
  return o;
}
const MATRIX=[...be32(0x10000),...be32(0),...be32(0),...be32(0),...be32(0x10000),...be32(0),...be32(0),...be32(0),...be32(0x40000000)];
function u32list(list){const o=new Uint8Array(list.length*4),dv=new DataView(o.buffer);list.forEach((v,i)=>dv.setUint32(i*4,v>>>0));return o;}
function sttsBox(deltas){
  const runs=[];
  for(const d of deltas){const r=runs[runs.length-1];if(r&&r[1]===d) r[0]++;else runs.push([1,d]);}
  return mkBox('stts',[0,0,0,0],be32(runs.length),u32list(runs.flat()));
}
const stscBox=n=>mkBox('stsc',[0,0,0,0],be32(1),be32(1),be32(n),be32(1));
const stszBox=sizes=>mkBox('stsz',[0,0,0,0],be32(0),be32(sizes.length),u32list(sizes));
const stcoBox=off=>mkBox('stco',[0,0,0,0],be32(1),be32(off));
const tkhdBox=(id,ms,vol,w,h)=>mkBox('tkhd',[0,0,0,3],be32(0),be32(0),be32(id),be32(0),be32(ms),zeros(8),be16(0),be16(0),be16(vol),be16(0),MATRIX,be32(w*65536),be32(h*65536));
const mdhdBox=(ts,dur)=>mkBox('mdhd',[0,0,0,0],be32(0),be32(0),be32(ts),be32(dur),be16(0x55C4),be16(0));
const hdlrBox=(type,name)=>mkBox('hdlr',[0,0,0,0],be32(0),fourcc(type),zeros(12),[...name].map(c=>c.charCodeAt(0)),[0]);
const dinfBox=()=>mkBox('dinf',mkBox('dref',[0,0,0,0],be32(1),mkBox('url ',[0,0,0,1])));
function esdsBox(asc){
  const dsi=[5,asc.length,...asc];
  const dcd=[4,13+dsi.length,0x40,0x15,0,0,0,...be32(0),...be32(0),...dsi];
  const es=[3,3+dcd.length+3,0,0,0,...dcd,6,1,2];
  return mkBox('esds',[0,0,0,0],es);
}
function buildMp4(o){
  const {W,H,fps,vdesc,vs,endTick,audio,vp9}=o;
  const TS=fps*1000;
  const vDeltas=vs.map((s,i)=>((i+1<vs.length?vs[i+1].tick:endTick)-s.tick)*1000);
  const vDur=vDeltas.reduce((a,b)=>a+b,0);
  const vMs=Math.round(vDur*1000/TS);
  const aMs=audio?Math.round(audio.frames.length*1024*1000/audio.rate):0;
  const movMs=Math.max(vMs,aMs);
  const vBytes=vs.reduce((a,s)=>a+s.d.length,0);
  const aBytes=audio?audio.frames.reduce((a,f)=>a+f.length,0):0;
  const ftyp=mkBox('ftyp',fourcc('isom'),be32(512),fourcc('isom'),fourcc('iso2'),fourcc('avc1'),fourcc('mp41'));
  const keys=[];vs.forEach((s,i)=>{if(s.key) keys.push(i+1);});
  if(!keys.length) keys.push(1);
  const avc1=mkBox(vp9?'vp09':'avc1',zeros(6),be16(1),be16(0),be16(0),zeros(12),be16(W),be16(H),be32(0x480000),be32(0x480000),be32(0),be16(1),zeros(32),be16(0x18),be16(0xFFFF),vp9?mkBox('vpcC',[1,0,0,0],[0,vp9,0x82,2,2,2],be16(0)):mkBox('avcC',vdesc));
  const make=(vOff,aOff)=>{
    const vStbl=mkBox('stbl',mkBox('stsd',[0,0,0,0],be32(1),avc1),sttsBox(vDeltas),mkBox('stss',[0,0,0,0],be32(keys.length),u32list(keys)),stscBox(vs.length),stszBox(vs.map(s=>s.d.length)),stcoBox(vOff));
    const vTrak=mkBox('trak',tkhdBox(1,vMs,0,W,H),mkBox('mdia',mdhdBox(TS,vDur),hdlrBox('vide','VideoHandler'),mkBox('minf',mkBox('vmhd',[0,0,0,1],zeros(8)),dinfBox(),vStbl)));
    let aTrak=new Uint8Array(0);
    if(audio){
      const mp4a=mkBox('mp4a',zeros(6),be16(1),be16(0),be16(0),be32(0),be16(audio.ch),be16(16),be16(0),be16(0),be32(audio.rate*65536),esdsBox(audio.asc));
      const aStbl=mkBox('stbl',mkBox('stsd',[0,0,0,0],be32(1),mp4a),sttsBox(audio.frames.map(()=>1024)),stscBox(audio.frames.length),stszBox(audio.frames.map(f=>f.length)),stcoBox(aOff));
      aTrak=mkBox('trak',tkhdBox(2,aMs,0x0100,0,0),mkBox('mdia',mdhdBox(audio.rate,audio.frames.length*1024),hdlrBox('soun','SoundHandler'),mkBox('minf',mkBox('smhd',[0,0,0,0],be16(0),be16(0)),dinfBox(),aStbl)));
    }
    const mvhd=mkBox('mvhd',[0,0,0,0],be32(0),be32(0),be32(1000),be32(movMs),be32(0x10000),be16(0x0100),be16(0),zeros(8),MATRIX,zeros(24),be32(audio?3:2));
    return mkBox('moov',mvhd,vTrak,aTrak);
  };
  let moov=make(0,0);
  const base=ftyp.length+moov.length+8;
  moov=make(base,base+vBytes);
  const mdatHead=new Uint8Array(8);mdatHead.set(be32(8+vBytes+aBytes),0);mdatHead.set(fourcc('mdat'),4);
  const parts=[ftyp,moov,mdatHead,...vs.map(s=>s.d)];
  if(audio) parts.push(...audio.frames);
  return new Blob(parts,{type:'video/mp4'});
}
function avcLevel(W,H,fps){
  const mbs=Math.ceil(W/16)*Math.ceil(H/16),mbps=mbs*fps;
  for(const [id,fs,ps] of [[0x1F,3600,108000],[0x28,8192,245760],[0x2A,8704,522240],[0x32,22080,589824],[0x33,36864,983040],[0x34,36864,2073600]])
    if(mbs<=fs&&mbps<=ps) return id;
  return 0x34;
}
function mixAudio(starts,seconds){
  const rate=starts[0].buf.sampleRate,n=Math.ceil(seconds*rate);
  const L=new Float32Array(n),Rr=new Float32Array(n);
  for(const s of starts){
    const b=s.buf,off=Math.round(s.at*rate);
    const c0=b.getChannelData(0),c1=b.numberOfChannels>1?b.getChannelData(1):c0;
    for(let i=0;i<c0.length&&off+i<n;i++){L[off+i]+=c0[i];Rr[off+i]+=c1[i];}
  }
  for(let i=0;i<n;i++){L[i]=Math.max(-1,Math.min(1,L[i]));Rr[i]=Math.max(-1,Math.min(1,Rr[i]));}
  return {rate,L,R:Rr,n};
}

const el={};

async function videoConfigs(W,H,fps){
  const hx=n=>n.toString(16).toUpperCase().padStart(2,'0');
  const bitrate=Math.round(Math.min(50e6,Math.max(6e6,W*H*fps*0.3)));
  const sup=async cfg=>{try{const s=await VideoEncoder.isConfigSupported(cfg);return !!(s&&s.supported);}catch(e){return false;}};
  const mk=(pre,lvl,br,extra)=>Object.assign({codec:'avc1.'+pre+hx(lvl),width:W,height:H,bitrate:br,framerate:fps,latencyMode:'quality',avc:{format:'avc'}},extra||{});
  const found=[];
  for(const lvl of [...new Set([avcLevel(W,H,fps),0x29,0x32])]){
    for(const pre of ['6400','4D00','42E0']){
      if(await sup(mk(pre,lvl,bitrate))){found.push([pre,lvl]);break;}
    }
  }
  const half=Math.max(2e6,Math.round(bitrate/2)),quarter=Math.max(2e6,Math.round(bitrate/4));
  const f0=found[0],f1=found[1],f2=found[2],picks=[];
  if(f0){
    picks.push(mk(f0[0],f0[1],bitrate),mk(f0[0],f0[1],half));
    if(f1) picks.push(mk(f1[0],f1[1],bitrate));
    picks.push(mk(f0[0],f0[1],bitrate,{latencyMode:'realtime'}));
    const sw=mk(f0[0],f0[1],half,{hardwareAcceleration:'prefer-software'});
    if(await sup(sw)) picks.push(sw);
    if(f2) picks.push(mk(f2[0],f2[1],bitrate));
    picks.push(mk(f0[0],f0[1],quarter));
    if(f1) picks.push(mk(f1[0],f1[1],half));
  }
  const list=[],seen=new Set();
  for(const c of picks){const key=JSON.stringify(c);if(!seen.has(key)){seen.add(key);list.push({cfg:c,kind:'h264'});}}
  list.length=Math.min(list.length,8);
  const px=W*H,lv=px<=2359296?40:px<=8912896?50:60,vbr=Math.round(Math.min(40e6,Math.max(4e6,px*fps*0.15)));
  const v9={codec:'vp09.00.'+lv+'.08',width:W,height:H,bitrate:vbr,framerate:fps,latencyMode:'realtime'};
  if(await sup(v9)) list.push({cfg:v9,kind:'vp9',level:lv});
  return {list};
}
async function encodeAudio(mix){
  if(typeof AudioEncoder!=='function'||typeof AudioData!=='function') return {note:'no sound: audio encoding is not available here'};
  const cfg={codec:'mp4a.40.2',sampleRate:mix.rate,numberOfChannels:2,bitrate:192000};
  let sup=null;try{sup=await AudioEncoder.isConfigSupported(cfg);}catch(e){}
  if(!sup||!sup.supported) return {note:'no sound: this browser cannot encode AAC'};
  const frames=[];let asc=null,err=null;
  const enc=new AudioEncoder({
    output:(c,m)=>{const d=new Uint8Array(c.byteLength);c.copyTo(d);frames.push(d);if(!asc&&m&&m.decoderConfig&&m.decoderConfig.description) asc=toU8(m.decoderConfig.description);},
    error:e=>{err=e;}
  });
  try{
    enc.configure(cfg);
    const B=4096;
    for(let off=0;off<mix.n;off+=B){
      const len=Math.min(B,mix.n-off),data=new Float32Array(len*2);
      data.set(mix.L.subarray(off,off+len),0);data.set(mix.R.subarray(off,off+len),len);
      const ad=new AudioData({format:'f32-planar',sampleRate:mix.rate,numberOfFrames:len,numberOfChannels:2,timestamp:Math.round(off*1e6/mix.rate),data});
      enc.encode(ad);ad.close();
      if(err) throw err;
      while(enc.encodeQueueSize>8) await sleep(4);
    }
    await enc.flush();
  }catch(e){return {note:'no sound: the AAC encoder failed'};}
  finally{try{enc.close();}catch(e){}}
  if(err||!asc||!frames.length) return {note:'no sound: the AAC encoder gave no data'};
  return {rate:mix.rate,ch:2,asc,frames};
}
async function recordOffline(job,cand){
  const W=el.cv.width,H=el.cv.height,fps=anim.fps,cfg=cand.cfg,vp9=cand.kind==='vp9';
  const vs=[];let vdesc=null,err=null;
  const enc=new VideoEncoder({
    output:(c,m)=>{
      const d=new Uint8Array(c.byteLength);c.copyTo(d);
      vs.push({d,key:c.type==='key',tick:Math.round(c.timestamp*fps/1e6)});
      if(!vp9&&!vdesc&&m&&m.decoderConfig&&m.decoderConfig.description) vdesc=toU8(m.decoderConfig.description);
    },
    error:e=>{err=e;}
  });
  try{
    cancelAnimationFrame(P.raf);stopAudio();
    enc.configure(cfg);
    P=newPlayer();P.gen=sequence();
    const gop=Math.max(1,Math.round(fps)),hold=Math.round(HOLD_MS*fps/1000);
    const starts=[];
    let k=0,count=0;
    for(;;){
      if(job.cancel) throw new Error('cancelled');
      if(err) throw err;
      if(!P.ctrl.bootComplete&&k*1000/fps>=BOOT_MS){P.ctrl.bootComplete=true;P.ctrl.bootAt=k*1000/fps;}
      const n=P.gen.next();
      if(n.done) break;
      const ev=n.value;
      if(ev.k==='pause'){k+=ev.n;continue;}
      const part=anim.parts[ev.pi],fr=part.frames[ev.fi];
      if(!fr.bmp&&!fr.err) await decodeNow(fr);
      if(job.cancel) throw new Error('cancelled');
      draw(part,fr);
      P.cur={pi:ev.pi,r:ev.r,fi:ev.fi};fr.used=++anim.seq;
      if(anim.mode==='stream') prefetch();
      if(ev.fi===0&&ev.r===0&&part.audioBuf) starts.push({buf:part.audioBuf,at:k/fps});
      const vf=new VideoFrame(el.cv,{timestamp:Math.round(k*1e6/fps),duration:Math.round(1e6/fps)});
      enc.encode(vf,{keyFrame:count%gop===0});
      vf.close();
      count++;k++;R.vt=k/fps;
      while(enc.encodeQueueSize>4){
        await new Promise(r=>{enc.ondequeue=()=>{enc.ondequeue=null;r();};setTimeout(r,40);});
        if(err) throw err;if(job.cancel) throw new Error('cancelled');
      }
      if(count===60){if(!vs.length) throw new Error('the encoder gave no output');if(!vp9&&!vdesc) throw new Error('the encoder gave no codec description');}
      if((count&3)===0) await sleep(0);
    }
    const endTick=k+hold;
    await enc.flush();
    if(err) throw err;
    if((!vp9&&!vdesc)||!vs.length) throw new Error('the encoder gave no usable video');
    let audio=null,note='';
    if(starts.length){
      const a=await encodeAudio(mixAudio(starts,endTick/fps));
      if(a.frames) audio=a;else note=a.note;
    }
    P.finished=true;P.running=false;
    R.stat={frames:vs.length,endTick,audio:!!audio,codec:cfg.codec,bitrate:cfg.bitrate};
    return {blob:buildMp4({W,H,fps,vdesc,vs,endTick,audio,vp9:vp9?cand.level:0}),ext:'mp4',kind:cand.kind,secs:endTick/fps,note};
  }finally{try{enc.close();}catch(e){}}
}
async function startRec(){
  if(!anim||recording()) return;
  if(!canRecord()){el.recNote.textContent='This browser cannot record video.';el.recNote.hidden=false;return;}
  ensureAudio();
  if(hasWebCodecs()){
    const job={cancel:false};R.job=job;R.vt=0;
    beginRecUI('Recording '+el.cv.width+' × '+el.cv.height+' frame by frame. Keep this screen on, it saves by itself when done.');
    let res=null;const fails=[];
    try{
      const info=await videoConfigs(el.cv.width,el.cv.height,anim.fps);
      for(const cand of info.list){
        if(job.cancel||R.job!==job) return;
        try{res=await recordOffline(job,cand);}
        catch(e){
          if(job.cancel||R.job!==job) return;
          console.warn('Frame-exact recording failed with '+cand.cfg.codec+':',e);
          if(cand.kind==='h264') fails.push(String((e&&e.message)||e).slice(0,80));
          R.vt=0;
        }
        if(res) break;
      }
    }catch(e){
      if(job.cancel||R.job!==job) return;
    }
    if(job.cancel||R.job!==job) return;
    R.job=null;
    if(res){
      let note=res.note||'';
      if(res.kind==='vp9') note=(note?note+' · ':'')+'VP9 inside MP4, H.264 failed here ('+(fails.length?fails[0]:'no H.264 encoder offered for this size')+')';
      finishRecording(res.blob,res.ext,res.secs,note);return;
    }

}

function recFrame(){
  if(!R.rec||!R.stream) return;
  try{
    if(R.track&&typeof R.track.requestFrame==='function') R.track.requestFrame();
    else if(typeof R.stream.requestFrame==='function') R.stream.requestFrame();

}
function pickRecorder(stream,bps,withAudio){

    try{
      if(MediaRecorder.isTypeSupported&&!MediaRecorder.isTypeSupported(m)) continue;
      const rec=new MediaRecorder(stream,{mimeType:m,videoBitsPerSecond:bps});
      return {rec,mime:m,ext:m.indexOf('mp4')>=0?'mp4':'webm'};
    }catch(e){}
  }
  try{return {rec:new MediaRecorder(stream),mime:'',ext:'webm'};}catch(e){}
  return null;
}
function startLive(){
  if(!hasLiveCapture()){el.recNote.textContent='This browser cannot record video.';el.recNote.hidden=false;return;}
  const W=el.cv.width,H=el.cv.height;
  let stream=el.cv.captureStream(0);
  let track=stream.getVideoTracks()[0];
  if(!(track&&typeof track.requestFrame==='function')&&typeof stream.requestFrame!=='function'){
    stream=el.cv.captureStream(anim.fps);track=stream.getVideoTracks()[0];
  }
  R.dest=null;
  if(actx&&anim.hasAudio){
    try{R.dest=actx.createMediaStreamDestination();R.dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));}catch(e){R.dest=null;}
  }
  R.bps=Math.round(Math.min(80e6,Math.max(8e6,W*H*anim.fps*0.5)));

  R.stream=stream;R.track=track;R.chunks=[];R.discard=false;R.stopping=false;R.mime=pick.mime;R.ext=pick.ext;

  R.rec=rec;
  try{rec.start();}catch(e){R.rec=null;el.recNote.textContent='Could not start recording: '+(e&&e.message||e);el.recNote.hidden=false;return;}
  R.t0=performance.now();

function stopRec(){

}
function cancelRec(){

function onRecStop(rec){

function updateButtons(){
  const rec=recording();
  el.bPause.textContent=P.paused?'Play':'Pause';
  el.bPause.disabled=!P.running||rec;
  el.bRestart.disabled=rec;
  el.rsBtn.disabled=rec;
  el.bRec.disabled=!anim||rec||!canRecord();
  if(!canRecord()) el.bRec.title='Recording is not supported in this browser';
}
function setLoading(on,txt,frac){
  el.loading.hidden=!on;
  if(on){el.loadTxt.textContent=txt||'';el.barFill.style.width=Math.round((frac||0)*100)+'%';}
}
function showMsg(t,warn){el.msg.textContent=t;el.msg.classList.toggle('warn',!!warn);el.msg.hidden=false;}
function hideMsg(){el.msg.hidden=true;}
function applyLayout(){
  const W=anim.width,H=anim.height;
  const cw=W+(W&1),ch=H+(H&1);
  el.cv.width=cw;el.cv.height=ch;
  ctx=el.cv.getContext('2d',{alpha:false});
  ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);
  el.screen.style.setProperty('--ar',cw+' / '+ch);
  el.screen.style.setProperty('--arn',String(cw/ch));
  const portrait=H>W;
  el.device.classList.toggle('phone',portrait);
  el.device.classList.toggle('box',!portrait);
  el.stageSec.hidden=false;
}

async function loadFile(file){
  const id=++loadId;
  unloadAnim();hideMsg();clearSave();
  el.dropSub.textContent='Reading '+file.name+'…';
  try{
    ensureAudio();
    const u8=new Uint8Array(await file.arrayBuffer());
    const loc=locate(zipEntries(u8));
    const descText=new TextDecoder().decode(await zipData(u8,loc.descEntry));
    const desc=parseDesc(descText);
    collectParts(desc,loc.base,loc.clean);
    const used=[loc.descEntry];
    for(const p of desc.parts){used.push(...p.files);if(p.trimEntry) used.push(p.trimEntry);if(p.audioEntry) used.push(p.audioEntry);}
    const packed=used.filter(e=>e.method!==0).length;
    let total=0;
    for(const p of desc.parts){
      let trims=null;
      if(p.trimEntry){try{trims=parseTrim(new TextDecoder().decode(await zipData(u8,p.trimEntry)));}catch(e){}}
      p.frames=p.files.map((e,i)=>{const t=trims&&trims[i];return{e,name:baseName(e.name),bmp:null,loading:null,err:false,used:0,tx:t?t.x:0,ty:t?t.y:0,tw:t?t.w:desc.width,th:t?t.h:desc.height};});
      total+=p.frames.length;
      if(p.audioEntry&&actx){
        try{const d=await zipData(u8,p.audioEntry);p.audioBuf=await actx.decodeAudioData(d.slice().buffer);}catch(e){}
      }
    }
    if(!total) throw new Error('No frames found. Expected part folders (as listed in desc.txt) containing PNG or JPG files.');
    if(id!==loadId) return;
    anim=Object.assign(desc,{u8,name:file.name,decoded:new Set(),inflight:0,seq:0,mode:'stream',bpf:0,cacheMax:60,
      hasAudio:desc.parts.some(p=>p.audioBuf)});
    P=newPlayer();
    applyLayout();
    if(packed) showMsg('Warning: this zip is compressed ('+packed+' of '+used.length+' files). Android needs compression level 0 (store only), so it may not play on a real phone.',true);
    el.drop.classList.add('compact');
    el.dropTitle.textContent=file.name;
    el.dropSub.textContent=(file.size/1048576).toFixed(1)+' MB · '+desc.width+'×'+desc.height+' @ '+desc.fps+' fps · tap to load another zip';
    setLoading(true,'Decoding frames…',0);
    updateButtons();

    const firstIdx=anim.parts.findIndex(p=>p.frames.length);
    const first=anim.parts[firstIdx].frames[0];
    await decodeNow(first);
    if(id!==loadId) return;
    const bw=first.bmp?first.bmp.width:desc.width,bh=first.bmp?first.bmp.height:desc.height;
    anim.bpf=bw*bh*4;
    anim.mode=total*anim.bpf<=PRELOAD_BUDGET?'preload':'stream';
    anim.cacheMax=Math.max(LOOKAHEAD+8,Math.floor(STREAM_BUDGET/anim.bpf));

    let list;
    if(anim.mode==='preload'){
      list=[];for(const p of anim.parts) for(const f of p.frames) list.push(f);
    }else{
      list=predict({pi:firstIdx,r:0,fi:-1},LOOKAHEAD).map(([a,b])=>anim.parts[a].frames[b]);
      list.unshift(first);
    }
    await preload(list,(d,t)=>{if(id===loadId) setLoading(true,'Decoding frames… '+d+' / '+t,d/t);});
    if(id!==loadId) return;
    setLoading(false);
    start();
  }catch(err){
    if(id!==loadId) return;
    setLoading(false);
    if(!anim) el.stageSec.hidden=true;
    el.dropSub.textContent='Choose another zip';
    try{console.warn(err);}catch(e){}
    showMsg('Not a valid boot animation file.');
  }
}

const nativeFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
const isFs=()=>nativeFs()===el.screen||el.screen.classList.contains('pseudo-fs');
let idleT=0;
function poke(){
  el.screen.classList.remove('idle');clearTimeout(idleT);
  if(isFs()) idleT=setTimeout(()=>el.screen.classList.add('idle'),2500);
}
function updateFs(){
  const on=isFs();
  el.screen.classList.toggle('is-fs',on);
  el.device.classList.toggle('is-fs',on);
  el.fsBtn.title=on?'Exit fullscreen':'Fullscreen';
  try{if(window.Android&&Android.orient) Android.orient(on&&anim?(anim.width>=anim.height?6:7):-1);}catch(e){}
  try{
    const o=window.screen.orientation;
    if(on&&anim&&o&&o.lock) o.lock(anim.width>=anim.height?'landscape':'portrait').catch(()=>{});
    else if(!on&&o&&o.unlock) o.unlock();
  }catch(e){}
  poke();
}
async function toggleFs(){
  if(!anim) return;
  if(isFs()){
    if(el.screen.classList.contains('pseudo-fs')){el.screen.classList.remove('pseudo-fs');document.body.classList.remove('noscroll');}
    else{const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document);}
    updateFs();return;
  }
  const req=window.Android?null:(el.screen.requestFullscreen||el.screen.webkitRequestFullscreen);
  if(req){try{await req.call(el.screen);return;}catch(e){}}
  el.screen.classList.add('pseudo-fs');document.body.classList.add('noscroll');updateFs();
}
document.addEventListener('fullscreenchange',updateFs);
document.addEventListener('webkitfullscreenchange',updateFs);

el.file.addEventListener('change',()=>{const f=el.file.files[0];if(f)loadFile(f);el.file.value='';});
el.drop.addEventListener('click',ensureAudio);
['dragenter','dragover'].forEach(t=>window.addEventListener(t,e=>{e.preventDefault();el.drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>window.addEventListener(t,e=>{e.preventDefault();if(t==='drop'||e.target===document.documentElement)el.drop.classList.remove('over');}));
window.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadFile(f);});
el.bRestart.onclick=restart;
el.rsBtn.onclick=e=>{e.stopPropagation();restart();poke();};
el.bPause.onclick=togglePause;
el.bRec.onclick=startRec;
if(window.Android) el.dropSub.textContent='Tap to choose the zip file.';
el.fsBtn.onclick=e=>{e.stopPropagation();toggleFs();};
['mousemove','touchstart','pointerdown'].forEach(t=>el.screen.addEventListener(t,poke,{passive:true}));
window.addEventListener('keydown',e=>{
  if(!anim||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==='r') restart();
  else if(k==='f') toggleFs();
  else if(k===' '&&!isFs()){e.preventDefault();togglePause();}
  else if(k==='escape'&&el.screen.classList.contains('pseudo-fs')) toggleFs();
});
window.__bootBack=()=>{if(isFs()){toggleFs();return true;}return false;};
updateButtons();
</script>
</body>
</html>
